name: Agent skills

on:
  pull_request:
    paths: ["skills/**", "scripts/sync_skills.py", ".github/workflows/skills.yml", "README.md"]
  push:
    branches: [main]
    paths: ["skills/**", "scripts/sync_skills.py", ".github/workflows/skills.yml", "README.md"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install both skills for Codex and Claude Code
        run: |
          skills_test_dir=$(mktemp -d)
          cd "$skills_test_dir"
          npx --yes skills@1.7.6 add "$GITHUB_WORKSPACE" --skill trajectory --skill agent-feedback --agent codex --agent claude-code --yes
          diff -r "$GITHUB_WORKSPACE/skills" "$skills_test_dir/.agents/skills"
          diff -r "$GITHUB_WORKSPACE/skills" "$skills_test_dir/.claude/skills"
      - name: Compare public skills with the released SDK installer
        run: uv run --no-project --with 'trajectory-sdk>=0.10.13' python scripts/sync_skills.py
